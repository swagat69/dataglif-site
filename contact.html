<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - DataGlif</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #FFFFFF;
      color: #000000;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .navbar-logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #000000;
      cursor: pointer;
    }

    .navbar-nav {
      display: flex;
      gap: 2rem;
    }

    .nav-item {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.875rem;
      color: #000000;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-item:hover {
      color: #22d3ee;
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    /* Contact Section */
    .contact-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8rem 2rem 4rem;
      background: linear-gradient(135deg, #f6f5f3 0%, #ffffff 100%);
    }

    .contact-container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .contact-info {
      position: sticky;
      top: 8rem;
    }

    .contact-info h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      color: #0a0a0b;
    }

    .contact-info p {
      font-size: 1.125rem;
      line-height: 1.6;
      color: rgba(0, 0, 0, 0.6);
      margin-bottom: 2.5rem;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .contact-item {
      display: flex;
      align-items: start;
      gap: 1rem;
    }

    .contact-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: #22d3ee;
    }

    .contact-item-content h3 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #0a0a0b;
    }

    .contact-item-content a {
      font-size: 1rem;
      color: #22d3ee;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .contact-item-content a:hover {
      opacity: 0.7;
    }

    /* Contact Form */
    .contact-form {
      background: #ffffff;
      padding: 3rem;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #0a0a0b;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.875rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      background: #ffffff;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #22d3ee;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-submit {
      width: 100%;
      padding: 1rem;
      background: #0a0a0b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .form-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 1024px) {
      .contact-container {
        grid-template-columns: 1fr;
        gap: 3rem;
      }

      .contact-info {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .navbar-nav {
        display: none;
      }

      .contact-form {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-logo" onclick="window.location.href='index.html'">DataGlif</div>

    <div class="navbar-nav">
      <a href="index.html" class="nav-item">Home</a>
      <a href="services.html" class="nav-item">Services</a>
      <a href="approach.html" class="nav-item">Our Approach</a>
      <a href="contact.html" class="nav-item">Contact</a>
    </div>

    <div class="navbar-actions">
      <button class="cta-button" onclick="window.location.href='contact.html'">
        <span>Book a Call</span>
      </button>
    </div>
  </nav>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="contact-container">

      <!-- Contact Info -->
      <div class="contact-info">
        <h1>Let's Talk About Your Data</h1>
        <p>
          Whether you need annotation services, data operations, or a custom pipeline —
          we're here to help you build better datasets.
        </p>

        <div class="contact-details">
          <div class="contact-item">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <div class="contact-item-content">
              <h3>Email</h3>
              <a href="mailto:hello@dataglif.com">hello@dataglif.com</a>
            </div>
          </div>

          <div class="contact-item">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <div class="contact-item-content">
              <h3>Location</h3>
              <span style="color: rgba(0,0,0,0.6);">San Francisco, CA</span>
            </div>
          </div>

          <div class="contact-item">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            <div class="contact-item-content">
              <h3>Response Time</h3>
              <span style="color: rgba(0,0,0,0.6);">Within 24 hours</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form">
        <form>
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label for="email">Work Email *</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company">
          </div>

          <div class="form-group">
            <label for="service">Service Interest</label>
            <select id="service" name="service">
              <option value="">Select a service</option>
              <option value="image-video">Image & Video Annotation</option>
              <option value="3d-spatial">3D & Spatial Data</option>
              <option value="text-documents">Text & Documents</option>
              <option value="audio-multimodal">Audio & Multimodal</option>
              <option value="data-ops">Data Operations & QA</option>
              <option value="custom">Custom Pipeline</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Tell us about your project *</label>
            <textarea id="message" name="message" required placeholder="What kind of data are you working with? What's the scale of your project?"></textarea>
          </div>

          <button type="submit" class="form-submit">Send Message</button>
        </form>
      </div>

    </div>
  </section>

  <script>
    // Form submission handler
    document.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Form submission would be processed here. Connect to your backend service.');
    });
  </script>

</body>
</html>

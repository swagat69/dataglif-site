<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLA Interactive Booklet - Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: Arial, sans-serif;
      background: #e7e6e3;
      color: #f6f2e9;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .reading-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .book-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      gap: 0;
      align-items: center;
      justify-content: center;
    }

    .page {
      height: 100%;
      aspect-ratio: 1136 / 1548;
      background: white;
      border: none;
      box-shadow: 2px 4px 16px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.4s ease;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .page-left {
      border-radius: 0;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1), inset 6px 0 14px rgba(0, 0, 0, 0.02);
    }

    .page-right {
      border-radius: 0;
      box-shadow: -2px 0 12px rgba(0, 0, 0, 0.1), inset -6px 0 14px rgba(0, 0, 0, 0.02);
    }

    .spine-shadow {
      position: absolute;
      top: 0;
      left: 50%;
      width: 14px;
      height: 100%;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.01) 46%, rgba(0, 0, 0, 0.15));
      filter: blur(1px);
      opacity: 0.5;
      pointer-events: none;
      transform: translateX(-50%);
      z-index: 10;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .book-container {
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .page {
        height: auto;
        width: 90%;
        max-width: 500px;
      }

      .page-left {
        border-radius: 5px;
      }

      .page-right {
        display: none;
      }

      .spine-shadow {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="reading-stage">
    <div class="book-container">
      <div class="spine-shadow"></div>
      <div class="page page-left">
        <img id="leftPageImg" src="pages/page-01.png" alt="Page 1">
      </div>
      <div class="page page-right">
        <img id="rightPageImg" src="pages/page-02.png" alt="Page 2">
      </div>
    </div>
  </div>

  <script>
    const TOTAL_PAGES = 28;
    const BASE_PATH = 'pages/';
    let currentPage = 1;
    let autoplayInterval = null;

    function padNumber(num) {
      return String(num).padStart(2, '0');
    }

    function updateDisplay() {
      const isMobile = window.innerWidth <= 768;

      if (isMobile) {
        document.getElementById('leftPageImg').src = `${BASE_PATH}page-${padNumber(currentPage)}.png`;
      } else {
        const leftPage = currentPage;
        const rightPage = Math.min(currentPage + 1, TOTAL_PAGES);

        document.getElementById('leftPageImg').src = `${BASE_PATH}page-${padNumber(leftPage)}.png`;
        document.getElementById('rightPageImg').src = `${BASE_PATH}page-${padNumber(rightPage)}.png`;
      }
    }

    function nextPage() {
      const isMobile = window.innerWidth <= 768;
      currentPage += isMobile ? 1 : 2;
      if (currentPage > TOTAL_PAGES) {
        currentPage = 1;
      }
      updateDisplay();
    }

    function startAutoplay() {
      autoplayInterval = setInterval(() => {
        nextPage();
      }, 2400);
    }

    window.addEventListener('resize', updateDisplay);

    updateDisplay();
    setTimeout(() => {
      startAutoplay();
    }, 1000);
  </script>
</body>
</html>

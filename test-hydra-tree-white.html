<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataGlif Workflow - Full-Cover Blue Tree on White Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-blue: #2563EB;
      --accent-cyan: #38BDF8;
      --text-dark: #0F172A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #FFFFFF;
      color: var(--text-dark);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .workflow-section {
      background: #FFFFFF;
      padding: 6rem 0 5rem;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hydra-tree-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      filter: invert(1) hue-rotate(6deg) saturate(2.6) contrast(1.22) brightness(0.98);
      opacity: 0.95;
      transition: filter 0.3s ease;
    }

    .hydra-tree-bg .unicorn-embed {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transform: scale(1.32) translateY(6%);
      transform-origin: center bottom;
    }

    .workflow-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .workflow-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 3.5rem;
      padding: 0 3rem;
      text-align: center;
    }

    .workflow-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2563EB;
      margin-bottom: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      background: rgba(37, 99, 235, 0.08);
      padding: 4px 12px;
      border-radius: 9999px;
    }

    .workflow-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(2.25rem, 4vw, 3.5rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.05em;
      color: #0F172A;
      text-align: center;
    }

    .workflow-track-wrapper {
      width: 100%;
      overflow: hidden;
      padding: 2.5rem 0;
      position: relative;
    }

    .workflow-track {
      display: flex;
      gap: 1.5rem;
      padding: 0 3rem;
      width: max-content;
      align-items: center;
    }

    .workflow-card {
      width: 320px;
      height: 220px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
      transition: all 0.3s ease;
    }

    .workflow-card:hover, .workflow-card.active {
      background: rgba(255, 255, 255, 0.98);
      border-color: #2563EB;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.14), 0 1px 3px rgba(37, 99, 235, 0.08);
      transform: translateY(-4px);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(37, 99, 235, 0.08);
      color: #2563EB;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .workflow-card:hover .card-icon, .workflow-card.active .card-icon {
      background: #2563EB;
      color: #FFFFFF;
    }

    .card-icon svg { width: 24px; height: 24px; stroke-width: 2; }

    .workflow-card h3 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .tweak-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .tweak-btn {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.8);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tweak-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .tweak-btn.active { background: #2563EB; color: #fff; }
  </style>

  <!-- Unicorn Studio SDK -->
  <script src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.11/dist/unicornStudio.umd.js"></script>
</head>
<body>

  <section class="workflow-section">
    <div id="treeContainer" class="hydra-tree-bg">
      <div 
        class="unicorn-embed" 
        data-us-project="oUvrbeOq0WuFIWyfR7ZD" 
        data-us-scale="1" 
        data-us-dpi="1.5" 
        data-us-fps="60"
        data-us-lazyload="false"
      ></div>
    </div>

    <div class="workflow-container">
      <div class="workflow-header">
        <div class="workflow-tag">High-Throughput Pipeline</div>
        <h2 class="workflow-title">Workflow</h2>
      </div>

      <div class="workflow-track-wrapper">
        <div class="workflow-track">
          <div class="workflow-card active">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
              </svg>
            </div>
            <h3>01. Learn</h3>
          </div>

          <div class="workflow-card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <h3>02. Discover</h3>
          </div>

          <div class="workflow-card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
            </div>
            <h3>03. Candidate Selection <br/> from Talent Pool</h3>
          </div>

          <div class="workflow-card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
              </svg>
            </div>
            <h3>04. Train</h3>
          </div>

          <div class="workflow-card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <h3>05. Manage Production</h3>
          </div>

          <div class="workflow-card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <h3>06. Review + Deliver</h3>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="tweak-panel">
    <span style="color: rgba(255,255,255,0.6); font-size: 12px;">Website Blue Tint:</span>
    <button class="tweak-btn active" onclick="applyTweak('dataglif-cyan', this)">DataGlif Cyan (#38BDF8)</button>
    <button class="tweak-btn" onclick="applyTweak('dataglif-royal', this)">DataGlif Royal Blue (#2563EB)</button>
    <button class="tweak-btn" onclick="applyTweak('dataglif-sky', this)">Deep Sky Blue (#0284C7)</button>
    <button class="tweak-btn" onclick="applyTweak('vibrant-ice', this)">Vibrant Ice Cyan</button>
  </div>

  <script>
    const tweaks = {
      'dataglif-cyan': 'invert(1) hue-rotate(6deg) saturate(2.6) contrast(1.22) brightness(0.98)',
      'dataglif-royal': 'invert(1) hue-rotate(18deg) saturate(3.0) contrast(1.26) brightness(0.94)',
      'dataglif-sky': 'invert(1) hue-rotate(12deg) saturate(2.4) contrast(1.20) brightness(0.96)',
      'vibrant-ice': 'invert(1) hue-rotate(0deg) saturate(2.8) contrast(1.18) brightness(1.02)'
    };

    function applyTweak(key, btn) {
      const el = document.getElementById('treeContainer');
      if (el && tweaks[key]) {
        el.style.filter = tweaks[key];
      }
      document.querySelectorAll('.tweak-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.UnicornStudio) {
        window.UnicornStudio.init();
      }
    });
  </script>
</body>
</html>
